[package]
name = "rust-client"
version = "0.1.0"
edition = "2021"

[features]
default = ["either"]
either = ["serde_store/either"]

[[bin]]
name = "rust-client"
path = "src/main.rs"


[dependencies]
serde_store = { path = "../..", features = ["either"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking"] }
anyhow = "1.0"
colored = "2.0"
either = "1.13"
