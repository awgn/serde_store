[package]
name = "serde_store"
version = "0.1.0"
edition = "2021"
description = "A serialization format focused on speed and compactness"
license = "MIT or GPL-3.0"

[features]
either = ["dep:either"]
smol_str = ["dep:smol_str"]

[dependencies]
byteorder = "1.5.0"
serde = { version = "1.0.219", features = ["serde_derive"] }
thiserror = "2.0.12"
either = { version = "1.13", optional = true, features = ["serde"] }
smol_str = { version = "0.3", optional = true, features = ["serde"] }

[dev-dependencies]
serde_json = "1.0"
