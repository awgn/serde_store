[package]
name = "serde_store"
version = "0.2.2"
edition = "2021"
description = "A Rust implementation of the Haskell store binary serialization format using Serde"
license = "MIT OR Apache-2.0"
repository = "https://github.com/awgn/serde_store"
homepage = "https://github.com/awgn/serde_store"
documentation = "https://docs.rs/serde_store"
readme = "README.md"
keywords = ["serialization", "serde", "haskell", "store", "binary"]
categories = ["encoding", "no-std"]

[features]
either = ["dep:either"]
smol_str = ["dep:smol_str"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
byteorder = "1.5.0"
serde = { version = "1.0.219", features = ["serde_derive"] }
thiserror = "2.0.12"
either = { version = "1.13", optional = true, features = ["serde"] }
smol_str = { version = "0.3", optional = true, features = ["serde"] }

[dev-dependencies]
serde_json = "1.0"
